const K='takken-v1', $=id=>document.getElementById(id), main=$('main');
let S;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(){return {order:shuffle(Q.map((_,i)=>i)),pos:0,ok:0,wrong:[],review:null}}
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.order&&s.order.length===Q.length)return s}catch(e){}return fresh()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
// 通常は全問を1周（重複なし）。復習モードは間違えた問題だけを1周
function deck(){return S.review||S}
function render(){
  const d=deck(), n=d.order.length, rv=!!S.review;
  $('mode').textContent=rv?'復習をやめる':'復習 ('+S.wrong.length+')';
  $('mode').style.display=(rv||S.wrong.length)?'':'none';
  $('pos').textContent=(rv?'復習 ':'')+Math.min(d.pos+1,n)+' / '+n;
  $('score').textContent='正解 '+d.ok+' / '+d.pos;
  $('bar').style.width=(d.pos/n*100)+'%';
  if(d.pos>=n)return end();
  const id=d.order[d.pos], q=Q[id];
  main.innerHTML='<span class="tag">'+q[0]+'</span><p class="q">'+q[1]+'</p><div class="btns"><button data-a="1">○</button><button data-a="0">×</button></div><div class="res" id="res"></div>';
  main.querySelectorAll('.btns button').forEach(b=>b.onclick=()=>answer(id,+b.dataset.a,b));
}
function answer(id,a,btn){
  const q=Q[id], hit=a===q[2], d=deck();
  main.querySelectorAll('.btns button').forEach(b=>b.disabled=true);btn.classList.add('pick');
  if(hit){d.ok++;S.wrong=S.wrong.filter(x=>x!==id)}else if(!S.wrong.includes(id))S.wrong.push(id);
  d.pos++;save();
  const r=$('res');r.style.display='block';
  r.innerHTML='<p><b class="'+(hit?'ok':'ng')+'">'+(hit?'正解':'不正解')+'</b>　答え：<b>'+(q[2]?'○':'×')+'</b></p><p>'+q[3]+'</p><button class="next" id="nx">次へ</button>';
  $('nx').onclick=render;$('nx').focus();
}
function end(){
  const d=deck(), rv=!!S.review;
  main.innerHTML='<div class="end"><p>'+(rv?'復習が終わりました':'全'+Q.length+'問が終わりました')+'</p><p class="big">'+d.ok+' / '+d.order.length+'</p>'+
    (S.wrong.length?'<button id="rw">間違えた'+S.wrong.length+'問を復習</button>':'')+'<button id="rs">最初からやり直す</button></div>';
  if($('rw'))$('rw').onclick=startReview;
  $('rs').onclick=reset;
}
function startReview(){S.review={order:shuffle(S.wrong.slice()),pos:0,ok:0};save();render()}
function reset(){if(deck().pos&&deck().pos<deck().order.length&&!confirm('進捗を消して最初からやり直しますか？'))return;S=fresh();save();render()}
$('reset').onclick=reset;
$('mode').onclick=()=>{if(S.review){S.review=null;save();render()}else startReview()};
document.addEventListener('keydown',e=>{
  const b=main.querySelectorAll('.btns button:not(:disabled)');
  if(b.length&&(e.key==='o'||e.key==='1'))b[0].click();
  else if(b.length&&(e.key==='x'||e.key==='2'))b[1].click();
  else if(e.key==='Enter'&&$('nx')&&document.activeElement!==$('nx'))$('nx').click();
});
S=load();render();
</script></body></html>
